spring:
  application:
    name: transaction-authorizer-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/authorizer_db}
    username: ${DB_USER:authorizer_admin}
    password: ${DB_PASSWORD:Ch4v3_F0rt3_L0c4l_99!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
      jakarta:
        persistence:
          lock:
            timeout: 3000
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:R3d1s_S3cur3_L0c4l_88!}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:18080}
